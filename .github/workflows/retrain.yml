name: Scheduled retraining
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.retrain_job
      # Persisting updated model artifacts requires an external registry/object store.
